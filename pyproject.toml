{
  "name": "mcp-web-search",
  "version": "1.0.0",
  "description": "MCP server providing privacy-respecting web search via SearXNG/DuckDuckGo",
  "main": "search_server.py",
  "scripts": {
    "start": "python search_server.py",
    "test": "pytest tests/ -v",
    "lint": "ruff check ."
  },
  "dependencies": {
    "mcp": ">=1.0.0",
    "httpx": ">=0.25.0",
    "beautifulsoup4": ">=4.12.0",
    "lxml": ">=4.9.0",
    "pydantic": ">=2.0.0",
    "python-dotenv": ">=1.0.0"
  },
  "devDependencies": {
    "pytest": ">=7.0.0",
    "pytest-asyncio": ">=0.21.0",
    "pytest-mock": ">=3.10.0",
    "ruff": ">=0.1.0"
  },
  "engines": {
    "python": ">=3.10"
  },
  "license": "MIT",
  "keywords": [
    "mcp",
    "web-search",
    "searxng",
    "duckduckgo",
    "privacy",
    "deepseek-harness"
  ],
  "author": "DeepSeek Harness Community",
  "repository": {
    "type": "git",
    "url": "https://github.com/deepseek-ai/mcp-web-search"
  },
  "classifiers": [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules"
  ]
}